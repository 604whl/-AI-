# 阶段3 本地验证环境（仅用于本地开发验证，不用于生产）
# 说明：复用本机已有镜像 pgvector/pgvector:pg16（项目需要 pgvector 扩展）与 redis:7-alpine
# 启动：docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xhsagent-postgres-dev
    environment:
      POSTGRES_DB: xhsagent
      POSTGRES_USER: xhsagent
      POSTGRES_PASSWORD: xhsagent_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xhsagent -d xhsagent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xhsagent-redis-dev
    command: ["redis-server"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata-dev:
  redisdata-dev:
