# 阿里云生产环境示例（密钥走环境变量 / KMS）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  storage:
    type: ${STORAGE_TYPE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:xhs-agent}
  ai:
    mock-enabled: false
    default-provider: deepseek
    deepseek:
      enabled: true
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-frontend-domain.com}

# 生产环境开放 actuator health 的 details（仅内网访问）
management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
