spring:
  application:
    name: xhs-agent-yunying
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xhsagent?currentSchema=app}
    username: ${SPRING_DATASOURCE_USERNAME:xhsagent}
    password: ${SPRING_DATASOURCE_PASSWORD:xhsagent_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app,kb
    create-schemas: true
    default-schema: app
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding:
        enabled: true
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: 1024
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: false
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        enabled: false
        options:
          model: text-embedding-3-small
    # MCP Server：将 Agent 工具以 Model Context Protocol 对外暴露，详见 docs/MCP-SERVER.md
    mcp:
      server:
        enabled: ${app.agent.mcp.enabled:false}
        name: xhs-agent
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: |
          XhsAgent MCP Server — 小红书全平台内容运营工具集。
          调用前请携带 Bearer JWT；本地调试可使用 X-Mcp-Api-Key + X-Mcp-User-Id。
        tool-callback-converter: true
        capabilities:
          resource: false
          prompt: false
          tool: true
        streamable-http:
          mcp-endpoint: /mcp
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8125
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  auth:
    jwt-secret: ${JWT_SECRET:xhs-agent-dev-jwt-secret-change-in-production-32b}
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:dashscope}
    fallback-providers: ${AI_FALLBACK_PROVIDERS:deepseek,zhipu}
    mock-enabled: ${AI_MOCK_ENABLED:false}
    analysis-timeout-seconds: 45
    analysis-max-retries: 1
    dashscope:
      enabled: ${DASHSCOPE_ENABLED:true}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
    openai:
      enabled: ${OPENAI_ENABLED:false}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
    zhipu:
      enabled: ${ZHIPU_ENABLED:false}
      api-key: ${ZHIPU_API_KEY:}
      base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      model: ${ZHIPU_CHAT_MODEL:glm-4-flash}
  rag:
    enabled: false
    analysis-enabled: false
    title-enabled: false
    top-k: 5
  agent:
    enabled: ${AGENT_ENABLED:false}
    mock-enabled: ${AI_MOCK_ENABLED:false}
    max-steps: 8
    total-timeout-seconds: 120
    session-ttl-hours: 24
    max-context-messages: 20
    daily-message-quota: 20
    tools:
      search-kb: true
      analyze-content: true
      generate-titles: true
      scan-compliance: true
      get-analysis-report: true
      list-recent-analyses: true
      analyze-cover: true
      optimize-draft: true
      web-search: false
      fetch-url: false
      get-hot-topics: true
      get-industry-calendar: true
      get-user-profile: true
    web-search:
      provider: tavily
      api-key: ${WEB_SEARCH_API_KEY:}
      daily-quota-per-user: 10
    mcp:
      enabled: ${MCP_SERVER_ENABLED:false}
      api-key: ${MCP_API_KEY:}
      exposed-tools:
        - search_kb
        - web_search
        - fetch_url
        - get_hot_topics
        - get_industry_calendar
      session-id-prefix: mcp_
  kb:
    source-dir: ${KB_SOURCE_DIR:./data/kb-sources}
    default-doc-type: viral_case
    chunking:
      chunk-size-tokens: 400
      chunk-overlap-tokens: 50
      min-chunk-size-chars: 100
      min-chunk-length-to-embed: 10
      max-num-chunks: 500
      keep-separator: true
    ingest:
      embed-on-ingest: true
      embedding-batch-size: 16
  storage:
    type: ${STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: xhs-agent
    local:
      base-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
      public-base-url: /api/v1/files/cover
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.shortvideoscripagent.xhsagentyunying.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
