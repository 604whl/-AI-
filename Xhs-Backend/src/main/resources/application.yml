spring:
  application:
    name: xhs-agent-yunying
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xhsagent?currentSchema=app}
    username: ${SPRING_DATASOURCE_USERNAME:xhsagent}
    password: ${SPRING_DATASOURCE_PASSWORD:xhsagent_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app,kb
    create-schemas: true
    default-schema: app
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: false
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        enabled: false
        options:
          model: text-embedding-3-small
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8125
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  auth:
    jwt-secret: ${JWT_SECRET:xhs-agent-dev-jwt-secret-change-in-production-32b}
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800
  ai:
    default-provider: dashscope
    mock-enabled: ${AI_MOCK_ENABLED:false}
    analysis-timeout-seconds: 45
    analysis-max-retries: 1
    dashscope:
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
    openai:
      enabled: false
  rag:
    enabled: false
    analysis-enabled: false
    title-enabled: false
    top-k: 5
  storage:
    type: ${STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: xhs-agent
    local:
      base-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
      public-base-url: /api/v1/files/cover
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.shortvideoscripagent.xhsagentyunying.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
