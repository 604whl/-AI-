spring:
  application:
    name: xhs-agent-yunying
  profiles:
    # 生产部署必须显式设置 SPRING_PROFILES_ACTIVE=prod。
    # 未设置时启动会失败（见 DefaultProfileGuard），避免误以 local 部署到公网。
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xhsagent?currentSchema=app}
    username: ${SPRING_DATASOURCE_USERNAME:xhsagent}
    password: ${SPRING_DATASOURCE_PASSWORD:xhsagent_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app,kb
    create-schemas: true
    default-schema: app
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:dummy-key-not-used-locally}
      chat:
        enabled: false
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding:
        enabled: false
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: 1024
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: false
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        enabled: false
        options:
          model: text-embedding-3-small
    # MCP Server：将 Agent 工具以 Model Context Protocol 对外暴露，详见 docs/MCP-SERVER.md
    mcp:
      server:
        enabled: ${app.agent.mcp.enabled:false}
        name: xhs-agent
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: |
          XhsAgent MCP Server — 小红书全平台内容运营工具集。
          调用前请携带 Bearer JWT；本地调试可使用 X-Mcp-Api-Key + X-Mcp-User-Id。
        tool-callback-converter: true
        capabilities:
          resource: false
          prompt: false
          tool: true
        streamable-http:
          mcp-endpoint: /mcp
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8125
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  auth:
    jwt-secret: ${JWT_SECRET:xhs-agent-dev-jwt-secret-change-in-production-32b}
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    fallback-providers: []
    mock-enabled: ${AI_MOCK_ENABLED:false}
    analysis-timeout-seconds: 45
    analysis-max-retries: 1
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:true}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
    # --- 其他模型模板：取消注释，enabled 改为 true，并把 default-provider 改为对应 id ---
    # dashscope:
    #   enabled: true
    # openai:
    #   enabled: true
    # zhipu:
    #   enabled: true
    #   api-key: ${ZHIPU_API_KEY:}
    #   base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    #   model: ${ZHIPU_CHAT_MODEL:glm-4-flash}
  rag:
    enabled: false
    analysis-enabled: false
    title-enabled: false
    top-k: 5
  agent:
    enabled: ${AGENT_ENABLED:false}
    mock-enabled: ${AI_MOCK_ENABLED:false}
    max-steps: 8
    total-timeout-seconds: 120
    session-ttl-hours: 24
    max-context-messages: 20
    daily-message-quota: 20
    tools:
      search-kb: true
      analyze-content: true
      generate-titles: true
      scan-compliance: true
      get-analysis-report: true
      list-recent-analyses: true
      analyze-cover: true
      optimize-draft: true
      web-search: false
      fetch-url: false
      get-hot-topics: true
      get-industry-calendar: true
      get-user-profile: true
    web-search:
      provider: tavily
      api-key: ${WEB_SEARCH_API_KEY:}
      daily-quota-per-user: 10
    mcp:
      enabled: ${MCP_SERVER_ENABLED:false}
      api-key: ${MCP_API_KEY:}
      exposed-tools:
        - search_kb
        - web_search
        - fetch_url
        - get_hot_topics
        - get_industry_calendar
      session-id-prefix: mcp_
  kb:
    source-dir: ${KB_SOURCE_DIR:./data/kb-sources}
    default-doc-type: viral_case
    chunking:
      chunk-size-tokens: 400
      chunk-overlap-tokens: 50
      min-chunk-size-chars: 100
      min-chunk-length-to-embed: 10
      max-num-chunks: 500
      keep-separator: true
    ingest:
      embed-on-ingest: true
      embedding-batch-size: 16
  task-queue:
    # 是否启用 Redis Streams 任务队列，默认 false（走旧的 @Async 兜底）
    enabled: false
    stream-key: xhs:tasks:stream
    dlq-key: xhs:tasks:dlq
    consumer-group: xhs-workers
    max-retry: 3
    # 指数退避秒数序列
    retry-backoff: 1,2,4
    # Worker 唯一标识，默认取 HOSTNAME 环境变量
    worker-id: ${HOSTNAME:worker-1}
    # XREADGROUP 阻塞超时
    poll-timeout: 5s
    # 心跳超时秒数（超过此时间无心跳视为 worker 死亡）
    heartbeat-timeout-seconds: 30
    # 幂等键保留天数
    idempotency-key-ttl-days: 90
    # 任务恢复扫描间隔（毫秒）
    recovery-scan-interval-ms: 60000
  storage:
    type: ${STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: xhs-agent
    local:
      base-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
      public-base-url: /api/v1/files/cover
  cors:
    # 部署时必须通过环境变量 CORS_ALLOWED_ORIGINS 显式覆盖。
    # 本地保留 localhost 兜底，prod profile 启动时 CorsStartupValidator 会校验不允许 localhost。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Actuator 端点：health 给内部健康检查，prometheus 给运维抓取。
# 注意：包含 prometheus 端点意味着任何能访问该端口的内部网络都可拉指标；
# 公网部署时务必通过基础设施层（nginx/envoy）限制 /actuator/prometheus 只能内网访问。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.shortvideoscripagent.xhsagentyunying.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
