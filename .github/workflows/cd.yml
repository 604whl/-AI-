name: cd

on:
  push:
    branches: [xhs_agent]
  release:
    types: [published]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xhsagent-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/xhs_agent' }}

      # ── 主应用镜像 ──
      - name: Build and push main app
        uses: docker/build-push-action@v6
        with:
          context: ./Xhs-Backend
          file: ./Xhs-Backend/Dockerfile
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_PROFILE=prod

      # ── Worker 镜像 ──
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./Xhs-Backend
          file: ./Xhs-Backend/Dockerfile.worker
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xhsagent-backend:${{ github.event_name == 'release' && 'latest' || github.ref_name }}-worker
            ghcr.io/${{ github.repository_owner }}/xhsagent-backend:${{ github.sha }}-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
